<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | ForensicLens</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .login-card {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            font-size: 1rem;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .brand-mini {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-mini .brand-icon {
            margin: 0 auto 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-mini">
            <div class="brand-icon">🛡</div>
            <h2 style="font-size: 1.4rem; margin-top: 12px;">Create Account</h2>
            <p style="color: var(--muted); font-size: 0.9rem;">Join the investigation team</p>
        </div>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a name" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Register</button>
        </form>

        <div style="margin-top: 24px; text-align: center; font-size: 0.9rem;">
            <span style="color: var(--muted);">Already have an account?</span>
            <a href="/login" style="color: var(--accent); text-decoration: none;">Login</a>
        </div>
    </div>

</body>

</html>
